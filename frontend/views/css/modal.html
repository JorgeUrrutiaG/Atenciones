 <style>
 
 /* ----------------------- Estilos del modal ----------------------- 
    #layoutModal{
        z-index: 999999;
    } */
    .modal .modal-body {
        overflow: auto;
    }

    /* Aseguramos que el modal de confirmación se vea con flexbox también */
    .modal-delete {
        display: none;
        position: fixed;
        z-index: 2001;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
    }

    .modal:active,
    .modal-delete.show {
        opacity: 1;
        visibility: visible;
        display: flex;
        /* transform: scale(1); */
    }

    .delete-modal-content {
        background-color: #1e2531;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px var(--shadow-color);
        max-width: 600px;
        width: 90%;
        transform: translateY(-50px);
        transition: transform 0.3s;
        position: relative;
        display: flex;
        /* Añadido para layout de flexbox */
        flex-direction: column;
        /* Apila los elementos verticalmente */
    }

    .modal-delete .delete-modal-content {
        max-width: 500px;
        text-align: center;
        color: #c9ddf1;
        font-size: 0.70;
    }


    .modal-delete.show .delete-modal-content {
        transform: translateY(0);
    }

    .delete-modal-header {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 15px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        /* Evita que el header se encoja */
    }

    .delete-modal-header h2 {
        margin: 0;
        color: #58a6ff;
        font-size: 1.6rem;
    }

    .delete-modal-header .close-btn {
        background: none;
        border: none;
        color: var(--text-color);
        font-size: 1.5em;
        cursor: pointer;
        transition: color 0.2s;
    }

    .delete-modal-header .close-btn {
        color: #dee2e6;
    }

    .delete-modal-header .close-btn:hover {
        color: #e67e22;
    }

    .delete-modal-footer {
        border-top: 1px solid var(--border-color);
        padding: 15px 15px;
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-shrink: 0;
        /* Evita que el footer se encoja */
    }

    .modal-delete .delete-modal-footer {
        justify-content: center;
    }

    .delete-modal-footer button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
        font-size: 0.80rem;
    }

    .delete-modal-footer .save-btn {
        background-color: #28a745;
        color: #fff;
    }

    .delete-modal-footer .cancel-btn {
        background-color: #c82333;
        color: #fff;
    }

    .delete-modal-footer .cancel-btn:hover {
        background-color: #c82333;
    }

    .delete-modal-footer .confirm-delete-btn {
        background-color: #537ff8;
        color: #fff;
    }

    .delete-modal-footer .confirm-delete-btn:hover {
        background-color: #c0392b;
    }


     .modal-header {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #123b68;
        /* color: white; */
        text-align: center;
    }

    .modal-header button {
        color: white;
    }

    .btn-close-white {
        filter: invert(1) grayscale(1) brightness(2);
    }

    .oculto {
        display: none;
    }


</style>
