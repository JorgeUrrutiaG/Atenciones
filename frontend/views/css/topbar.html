<style>

/* ----------------------- Barra Superior (Top Bar) ----------------------- */
    .topbar {
        grid-area: topbar;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0px 15px;
        box-shadow: 0 2px 5px #125185;
        transition: background-color 0.3s, box-shadow 0.3s;
        /*border-bottom: 1px solid #18528f;*/
    }

    .topbar-buttons,
    .topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .user-name {
        font-weight: bold;
        font-size: 0.80em;
        font-style: italic;
        cursor: default;
    }

    .user-cargo {
        color: #e9be8b;
        font-size: 0.70em;
    }

    /* Estilos para todos los botones de la barra superior */
    .topbar .btn {
        /* Mejoramos el estilo para que sean más visibles */
        background: #28282b;
        color: var(--text-color-white);
        border: 1px solid #5d5e5b;
        border-radius: 8px;
        padding: 12px 14px;
        cursor: pointer;
        font-size: 1.2em;
        transition: all 0.3s ease-in-out;
        display: flex;
        align-items: center;
    }

    #toggle-btn {
        color: #fd8308;
    }

    .toggle-btn.change {
        transform: rotate(180deg);
    }

    .topbar .btn:hover {
        background-color: var(--border-color);
        color: var(--accent-color);
        box-shadow: 0 4px 10px var(--shadow-color);
    }


    .topbar-tittle {
        font-weight: bold;
        cursor: default;
        font-size: 120%;
        text-transform: uppercase;
    }

    .topbar .topbar-divider {
        width: 0;
        border-right: 1px solid #f77133;
        height: calc(4.375rem - 2rem);
        margin: auto 1rem;
    }

    .profile-photo .logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        overflow: hidden;
        object-fit: cover;
    }

    .topbar .topbar-userData {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

</style>
