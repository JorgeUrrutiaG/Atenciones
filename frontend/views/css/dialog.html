<style>
    dialog::backdrop {
        background-color: rgba(26, 26, 46, 0.85);
        overflow-y: auto;
        backdrop-filter: blur(2px);
    }

    dialog {
        margin: 10px auto;
        border: none;
        border-radius: 12px;
        width: 100%;
        max-width: 800px;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 24px;
        background-color: #303030;
        color: #ffffff;
        /* border-radius: 12px; */
    }

    .custom-modal-header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
    }

    .modal-close-btn {
        background: none;
        border: none;
        font-size: 1.75rem;
        line-height: 1;
        color: #ffffff;
        opacity: 0.8;
        cursor: pointer;
        padding: 0;
        transition: opacity 0.15s;
    }

    .modal-close-btn:hover {
        cursor: pointer;
        opacity: 1;
    }

    .modal-body {
        width: 100%;
        padding: 10px 24px;
        background-color: #ffffff;

    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 16px 24px;
        border-top: 1px solid #b1b1b1;
        border-radius: 0 0 12px 12px;
        background-color: #ffffff;
        color: #031c35;
    }
</style>
