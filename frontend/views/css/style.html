<style>
    /* Definición de variables CSS para los temas del contenido principal */
    :root {
        --main-bg-color: #f0f2f5;
        --white-color: white;
        --dark-color: #323232;
        --cscj-color: #031c35;
        --white-bg-color: #ffffff;
        --text-color-greyblue: #28282b;
        --border-color: #dee2e6;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --modal-bg: rgba(0, 0, 0, 0.5);
        --modal-content-bg: #ffffff;
        --accent-color: #3498db;
        --success-color: #28a745;
        --error-color: #dc3545;
        --luz-calida: #ECD461;

        /* Colores Base */
        --cscj-light-color: #22568a;
        --blue-color: #0056b3;
        --blue-light-color: #7ec5f5;
        --primary-color: #007bff;
        --grey-light-color: #e5e6e4;
        --grey-color: #4b4b4b;
        --green-color: #116924;
        --green-light-color: #71e681;
        --orange-color: tomato;
        --yellow-color: #ff8b13;

        /*Medidas Base*/
        --topbar-height: 55px;
        --footer-height: 50px;
        --sidebar-width: 60px;
        --padding-main: 20px;
        /* --sidebar-width-expand: 180px; */

        /*------------ Footer -----------*/

        --bg-dark-deep: #0a0d16;
        --text-muted: #9ca3af;
        --accent-green: #10b981;

    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
        display: grid;
        max-width: 100vw;
        max-height: 100vh;
        background-color: #a7a7a7;
        /* Animación suave al empujar el contenido */
        transition: grid-template-columns 0.3s ease;
        grid-template-columns: var(--sidebar-width) 1fr;
        grid-template-rows: var(--topbar-height) auto var(--footer-height);
        grid-template-areas:
            "topbar topbar"
            "sidebar main"
            "footer footer";
    }

    h3 {
        font-size: 1.2375rem;
        color: #0f0000;
    }

    ol,
    ul {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    
</style>
