<!-- Modal de Atenciones -->
<div class="modal fade layout-modal" id="layoutModal" data-bs-backdrop="static" data-bs-keyboard="false"
    tabindex="-1" aria-labelledby="layoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header text-light">
                <h1 class="modal-title fs-5" id="layoutModalLabel">
                </h1>
                <button type="button" class="btn-close btn-close-white" data-bs-theme="dark" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="layoutModalBody">
                <form name="layoutModalForm" id="layoutModalForm">

                </form>
            </div>
            <div class="modal-footer" id="layoutModalFooter">
            </div>
        </div>
    </div>
</div>

<!-- Modal de confirmación de borrado -->
<div id="delete-modal" class="modal-delete">
    <div class="delete-modal-content">
        <div class="delete-modal-header">
            <h2>Confirmar Borrado</h2>
            <button class="close-btn" id="close-delete-modal-btn">&times;</button>
        </div>
        <div class="delete-modal-body">
            <p id="mensaje-borrar"></p>
        </div>
        <div class="delete-modal-footer">
            <button type="button" class="cancel-btn" id="cancel-delete-btn">Cancelar</button>
            <button type="button" class="confirm-delete-btn" id="confirm-delete-btn">Borrar</button>
        </div>
    </div>
</div>


<!-- Modal Atenciones Curso -->
<div class="modal fade" id="resumenAtencionesModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="resumenAtencionesLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="resumenAtencionesLabel">Resumen</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <h3 id="tituloAlumno"></h3>
                <hr />
                <div id="resumenAlumnoTableContainer">
                    <table id="resumenAlumnoTable" class="table table-striped table-hover">
                        <caption>
                            Alumno
                        </caption>
                        <thead class="table-dark"></thead>
                        <tbody id="resumenAlumnoTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal" data-bs-dismiss="modal"
                    id="resumenAtencionesCloseBtn">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
</div>
